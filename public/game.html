async function goFullscreen(){
 try{
   const el=document.documentElement;
   if(document.fullscreenElement)return;
   if(el.requestFullscreen) await el.requestFullscreen({navigationUI:"hide"});
   else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
 }catch(e){}
 document.body.classList.add('immersive');
 try{
   if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
 }catch(e){}
 updateFSButton();
}
async function exitFullscreen(){
 try{
   if(document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
   else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
 }catch(e){}
 document.body.classList.remove('immersive');
 updateFSButton();
}
function toggleFullscreen(){
 initAudio();
 if(document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains('immersive')) exitFullscreen();
 else goFullscreen();
}
function updateFSButton(){
 const b=document.getElementById('fs');
 if(!b)return;
 b.textContent=(document.fullscreenElement||document.webkitFullscreenElement||document.body.classList.contains('immersive'))?'⛶':'⛶';
 b.title='Tela inteira';
}
document.addEventListener('fullscreenchange',()=>{
 if(!document.fullscreenElement)document.body.classList.remove('immersive');
 updateFSButton();
});
window.addEventListener('resize',updateFSButton);

function escolha(){sfx('sel');show(`<h3>ESCOLHA SEU CAMINHO</h3><p>Duas portas estão abertas. Qual você segue?</p><div class="two">${['P','S'].map(k=>`<button id="b${k}"><img class="pt" alt="" src="${spr(PP(k),'d',0).toDataURL()}"><b>${k=='P'?'🛡️ PROTEÇÃO':'🚔 SEGURANÇA'}</b><br>${k=='P'?'Estatutos: direitos de crianças, jovens e idosos, e a rede que protege.':'Riscos, prevenção, participação e o Plano Nacional.'}</button>`).join('')}</div>`,1);$('#bP').onclick=()=>ini('P');$('#bS').onclick=()=>ini('S')}
function ini(p){S={p,pts:0,done:0,h:{},x:9.5,y:5.5,d:'d',wk:0,cb:0,best:0,tot:0,hit:0,q:0,ach:[],started:Date.now()};theme='a';sfx('go');hud();
show(`<h3>${p=='P'?'REDE DE PROTEÇÃO':'EQUIPE DE SEGURANÇA'}</h3><p>${p=='P'?'Você começa na Rede de Proteção da cidade.':'Você começa na equipe de segurança da cidade.'} Procure o ❗ no mapa. As classes do jogo são fictícias.</p><button id="go" class="big">COMEÇAR</button>`);$('#go').onclick=()=>{sfx('sel');hide()};$('#go').focus()}
function run(m,i=0){const s=m[5][i],o=[s[2],...s[3]].sort(()=>Math.random()-.5);S.q=0;
show(`<div class="who"><img class="pt" alt="" src="${spr(NP(m),'d',0).toDataURL()}"><div><h3>${m[0]}</h3><small>${m[1]} · pergunta ${i+1} de ${m[5].length}</small></div></div><div class="bar" id="tb"><i></i></div><p id="tx"></p><div id="op"></div>`);
type($('#tx'),s[1],()=>{$('#op').innerHTML=o.map((x,k)=>`<button data-k="${k}"><b>${k+1}</b>${x}</button>`).join('');
$('#op').querySelectorAll('button').forEach(b=>b.onclick=()=>resp(m,i,o,+b.dataset.k));S.q=1;S.tm=S.tmax=30;S.cur={m,i,o}})}
function resp(m,i,o,k){if(!S.q)return;S.q=0;const s=m[5][i],ok=k>=0&&o[k]==s[2],h=S.h[s[0]]=S.h[s[0]]||[0,0];h[1]++;S.tot++;let gn=0;

function R(x,y,w,h,c){TH.x.fillStyle=c;TH.x.fillRect(Math.round(x),Math.round(y),w,h)}
function pline(x0,y0,x1,y1,th,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
 const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
 for(;;){R(x0-(th>>1),y0-(th>>1),th,th,c);if(x0==x1&&y0==y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}

function drawDancer(d,x,y,ph,walk){
 const s=Math.sin(ph),sw=Math.round(s*3),beat=Math.sin(ph*2);
 const squat=walk?0:2+Math.round(Math.abs(s)),hx=x+sw,hy=y-15+squat-d.h,tilt=Math.round(s*1.6);
 const J='#2f5ea8',JD='#21457e',O='#ff7a1a',OD='#d45a00',OL='#ffa04d';
 // sombra
 TH.x.globalAlpha=.35;R(x-9,y+1,19,2,'#000');TH.x.globalAlpha=1;
 // pernas (afastadas, joelhos flexionados)
 const lf=walk?x-3+Math.round(s*3):x-7,rf=walk?x+3-Math.round(s*3):x+6;
 pline(lf,y-1,hx-6-(walk?0:2),(y+hy)/2+1,3,JD);pline(hx-6-(walk?0:2),(y+hy)/2+1,hx-3,hy,3,J);
 pline(rf,y-1,hx+6+(walk?0:2),(y+hy)/2+1,3,JD);pline(hx+6+(walk?0:2),(y+hy)/2+1,hx+3,hy,3,J);
 R(lf-3,y-1,5,2,'#1d1424');R(rf-1,y-1,5,2,'#1d1424');
 // tronco acompanhando o quadril
 R(hx-5,hy-1,11,2,'#1f3d70');
 R(hx-5,hy-6,11,5,O);R(hx-5+tilt,hy-12,11,6,O);R(hx+4+tilt,hy-12,2,11,OD);R(hx-4+tilt,hy-11,2,4,OL);
 // braços dobrados na altura do peito, punhos alternados
 const shY=hy-11,lx=hx-6+tilt,rx=hx+6+tilt;
 const lfy=shY+3-(walk?0:(beat>0?3:0)),rfy=shY+3-(walk?0:(beat<0?3:0));
 const lex=lx-4-(walk?0:Math.round(Math.max(0,s)*2)),rex=rx+4+(walk?0:Math.round(Math.max(0,-s)*2));
 pline(lx,shY,lex,shY+5,3,O);pline(rx,shY,rex,shY+5,3,O);
 pline(lex,shY+5,hx-2+tilt,lfy,2,d.skin);pline(rex,shY+5,hx+2+tilt,rfy,2,d.skin);
 R(hx-4+tilt,lfy-1,3,3,d.skin);R(hx+2+tilt,rfy-1,3,3,d.skin);
 // cabeça
 const bx=hx-4+tilt+Math.round(s*.6),by=hy-21;
 R(bx+3,by+7,3,2,d.skin);R(bx,by,9,8,d.skin);
 R(bx+2,by+3,1,2,'#1b1b1b');R(bx+6,by+3,1,2,'#1b1b1b');R(bx+3,by+6,3,1,'#7a2e2e');
 const H=d.hair;
 if(d.g){R(bx+1,by+2,3,3,'#1b1b1b');R(bx+5,by+2,3,3,'#1b1b1b');R(bx+2,by+3,1,1,'#bfe3ff');R(bx+6,by+3,1,1,'#bfe3ff');R(bx+4,by+3,1,1,'#1b1b1b')}
 if(d.style=='short'){R(bx-1,by-2,11,3,H);R(bx-1,by,2,3,H);R(bx+8,by,2,2,H)}
 else if(d.style=='short2'){R(bx-1,by-3,11,4,H);R(bx-1,by,2,2,H);R(bx+3,by-4,4,1,H)}
 else if(d.style=='puff'){R(bx-3,by-6,15,7,H);R(bx-3,by,3,5,H);R(bx+9,by,3,5,H);R(bx-1,by-7,11,2,H)}
 else if(d.style=='cap'){R(bx-1,by-3,11,4,'#ffc233');R(bx+8,by,5,2,'#ffc233');R(bx-1,by+1,2,2,H);R(bx+1,by+7,7,1,H)}
 else{R(bx-1,by-2,11,3,H);R(bx-2,by,3,11+Math.round(Math.abs(s)),H);R(bx+8,by,3,11+Math.round(Math.abs(s)),H)}
 // placa com o nome sob os pés
 if(d.name&&!walk){const X=TH.x;X.font='6px VT323,monospace';X.textAlign='center';
  const w=Math.ceil(X.measureText(d.name).width);
  X.globalAlpha=.82;R(x-w/2-3,y+4,w+6,8,'#120a22');X.globalAlpha=1;
  R(x-w/2-3,y+4,w+6,1,'#ffc233');
  X.fillStyle='#fff4dc';X.fillText(d.name,x,y+10)}
}

function drawStage(t){
 const {W,H}=TH,X=TH.x,f=TH.feet,fy=f-8,val=Math.max(10,Math.round(H*.07));
 // parede do fundo em faixas
 const bands=['#1b0f33','#22133f','#2a184b','#331d58'];
 for(let i=0;i<4;i++)R(0,i*fy/4,W,Math.ceil(fy/4)+1,bands[i]);
 // painel de luzes do fundo
 for(let i=4,k=0;i<W;i+=9,k++){const on=RM?1:((k+(t/260|0))%3)!=0;R(i,val+6,3,3,on?(k%2?'#ffc233':'#ff7a1a'):'#4a2b2b')}
 for(let i=4,k=0;i<W;i+=9,k++){const on=RM?1:((k+(t/260|0))%3)!=1;R(i,fy-6,3,3,on?'#ff5d5d':'#3a1f2f')}
 // piso de madeira em perspectiva
 const pl=['#7a4a24','#8f5a2c'];let y=fy,h=2,k=0;
 while(y<H){R(0,y,W,h,pl[k%2]);R(0,y,W,1,'#5e3618');y+=h;h=Math.min(10,h+1);k++}
 const cx=W/2;X.fillStyle='#5e361888';for(let i=-12;i<=12;i++){const top=cx+i*10,bot=cx+i*34;pline(top,fy,bot,H,1,'#6a3e1c')}
 R(0,fy-2,W,2,'#c9874a');
 // holofotes
 X.globalCompositeOperation='lighter';
 const xs=TH.pos||[];
 xs.forEach((px,i)=>{const sx=px+(RM?0:Math.sin(t/900+i)*6);X.globalAlpha=.09+(RM?0:.03*Math.sin(t/300+i));
  X.fillStyle='#ffe2a0';X.beginPath();X.moveTo(sx-3,0);X.lineTo(sx+3,0);X.lineTo(px+16,f+3);X.lineTo(px-16,f+3);X.fill();
  X.globalAlpha=.22;X.beginPath();X.ellipse(px,f+1,15,4,0,0,7);X.fill()});
 X.globalAlpha=1;X.globalCompositeOperation='source-over';
}
function drawCurtain(open){
 const {W,H}=TH,val=Math.max(10,Math.round(H*.07)),min=Math.round(W*.08),cw=Math.round(min+(W/2-min)*(1-open));
 const C=['#a8182a','#d0302f','#e8503a','#d0302f'];
 for(let side=0;side<2;side++){const g=side?Math.max(4,cw/12):Math.max(4,cw/12);
  for(let i=0;i<cw;i+=g){const x=side?W-cw+i:i;R(x,0,Math.ceil(g),H,C[(i/g|0)%4]);R(x,0,1,H,'#7a0f1e')}
  R(side?W-cw:cw-2,0,2,H,'#5a0a16');R(side?W-cw:0,H-6,cw,6,'#ffc233')}
 for(let x=0;x<W;x++)R(x,0,1,val,C[(x>>2)%4]);
 for(let x=0;x<W;x+=12){R(x,val,12,3,'#d0302f');R(x+2,val+3,8,2,'#a8182a')}
 R(0,val-3,W,3,'#ffc233');
 return val;
}
function theaterResize(){
 if(!TH.c)return;const vw=innerWidth,vh=innerHeight,sp=document.getElementById('thSpot').getBoundingClientRect();
 TH.P=Math.max(2,Math.min(8,Math.floor(Math.min(vw/125,Math.max(sp.height,90)/46))));
 TH.W=TH.c.width=Math.ceil(vw/TH.P);TH.H=TH.c.height=Math.ceil(vh/TH.P);
 TH.feet=Math.round((sp.bottom-6)/TH.P);TH.x.imageSmoothingEnabled=false;
 TH.el.style.setProperty('--val',Math.max(10,Math.round(TH.H*.07))*TH.P+'px');
 const gap=Math.min(30,Math.floor(TH.W/4.6));TH.pos=[-1.5,-.5,.5,1.5].map(k=>Math.round(TH.W/2+k*gap));

function setPhase(n){if(TH.phase===n)return;TH.phase=n;TH.el.className='p'+n;
 if(n==3)stageSfx('curtain');if(n==4&&!TH.played.f){TH.played.f=1;stageSfx('enter')}if(n==6&&!TH.played.m){TH.played.m=1;fanfare('menu')}}

 const open=e<1100?0:Math.min(1,(e-1100)/1200),eo=1-Math.pow(1-open,3);
 drawStage(now);
 const ent=Math.min(1,Math.max(0,(e-2100)/900));
 if(e>2100){const bpm=112,ph=RM?Math.sin(now/1200)*.4:now/1000*Math.PI*bpm/60;
  DANCERS.forEach((d,i)=>{const side=i<2?-1:1,off=(1-ent)*(1-ent)*side*TH.W*.7;drawDancer(d,TH.pos[i]+off,TH.feet,ent<1?now/90:ph,ent<1)})}
 drawCurtain(eo);
 TH.raf=requestAnimationFrame(animateIntro);
}
function theaterShow(){
 TH.el.classList.remove('off');if(!TH.el.className.includes('p'))TH.el.className='p0';
 if(!TH.t0){TH.t0=performance.now();if(RM)TH.done=true}
 requestAnimationFrame(theaterResize);theaterResize();
 if(!TH.raf)TH.raf=requestAnimationFrame(animateIntro);
}
